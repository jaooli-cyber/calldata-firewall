name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        # actions/checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          fetch-tags: true
      # checkout rewrites an event tag ref to its commit after fetching it;
      # restore the remote annotated object before evidence validation.
      - name: Restore annotated release tag
        if: ${{ startsWith(github.ref, 'refs/tags/fe-014-submission-v') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = \
            "$GITHUB_SHA"
      - name: Set up Node.js
        # actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "20.19.5"
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Verify project
        if: ${{ !startsWith(github.ref, 'refs/tags/fe-014-submission-v') }}
        run: make verify
      - name: Verify and package release evidence
        if: ${{ startsWith(github.ref, 'refs/tags/fe-014-submission-v') }}
        run: make release-evidence EVIDENCE_TAG="$GITHUB_REF_NAME"
      - name: Upload release evidence
        if: ${{ startsWith(github.ref, 'refs/tags/fe-014-submission-v') }}
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: FE-014-evidence-${{ github.ref_name }}
          path: build/release-evidence/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
